<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Drawing Editor Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="flex flex-col h-screen bg-slate-900 text-slate-300 font-sans overflow-hidden">

    <!-- MAIN WORKSPACE: Split Top/Bottom -->
    <div class="flex flex-col flex-1 overflow-hidden p-2 gap-2">
        
        <!-- ================= TOP HALF: BIM MODEL ================= -->
        <div class="flex-1 bg-slate-950 border border-slate-700 rounded-lg relative overflow-hidden flex flex-col">
            <!-- Header for Top Section -->
            <div class="h-8 bg-slate-900 border-b border-slate-800 flex items-center px-4 shrink-0 justify-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">BIM Model</span>
            </div>

            <!-- 3D Viewport Area -->
            <div class="flex-1 relative flex items-center justify-center">
                <!-- Background Grid Pattern -->
                <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px); background-size: 40px 40px;"></div>

                <!-- Mock 3D Model Wireframe -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-50">
                    <svg width="300" height="300" viewBox="0 0 400 500" class="text-blue-500">
                        <path d="M200 350 L300 300 L200 250 L100 300 Z" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1"/>
                        <path d="M100 300 L100 400 L200 450 L200 350 Z" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
                        <path d="M300 300 L300 400 L200 450 L200 350 Z" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1"/>
                        <path d="M180 200 L240 170 L180 140 L120 170 Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M120 170 L120 310 L180 340 L180 200 Z" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M240 170 L240 310 L180 340 L180 200 Z" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </div>

                <!-- In-viewport Controls -->
                <div class="absolute bottom-4 left-4 flex space-x-2 bg-slate-900/80 p-1 rounded-md border border-slate-700/50">
                    <button class="p-1.5 text-slate-400 hover:text-white rounded transition-colors"><i data-lucide="eye" class="w-4 h-4"></i></button>
                    <button class="p-1.5 text-slate-400 hover:text-white rounded transition-colors"><i data-lucide="ghost" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

        <!-- ================= BOTTOM HALF: 3 COLUMNS ================= -->
        <div class="flex-1 flex gap-2 overflow-hidden">
            
            <!-- --- COLUMN 2: SHEET VIEW (Center) --- -->
            <div class="flex-1 bg-slate-950 border border-slate-700 rounded-lg flex flex-col relative overflow-hidden">
                <div class="h-8 bg-slate-900 border-b border-slate-800 flex items-center justify-center shrink-0">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Sheet View</span>
                </div>
                
                <!-- 2D Paper Canvas Area -->
                <div class="flex-1 p-4 flex items-center justify-center bg-slate-800/30 overflow-auto">
                    <div class="w-full h-full max-w-2xl max-h-full bg-white rounded shadow-lg relative border border-slate-300">
                        <div class="absolute inset-4 border-2 border-blue-900/10 rounded-sm"></div>
                        <div class="absolute bottom-4 right-4 w-32 h-16 border-2 border-blue-900/10 flex items-center justify-center text-blue-900/20 text-xs font-bold">TITLE BLOCK</div>
                    </div>
                </div>

                <!-- MARKUP TOOLBAR (Floating at bottom of Sheet View) -->
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-cyan-500/50 rounded-lg p-1.5 shadow-2xl flex items-center gap-1 backdrop-blur-md">
                    <button class="p-2 rounded-md transition-all duration-200 bg-cyan-500/20 text-cyan-400 shadow-inner" title="Select">
                        <i data-lucide="mouse-pointer-2" class="w-4 h-4" stroke-width="2"></i>
                    </button>
                    <button class="p-2 rounded-md transition-all duration-200 text-slate-400 hover:bg-slate-800 hover:text-slate-200" title="Draw">
                        <i data-lucide="pencil" class="w-4 h-4" stroke-width="2"></i>
                    </button>
                    <button class="p-2 rounded-md transition-all duration-200 text-slate-400 hover:bg-slate-800 hover:text-slate-200" title="Erase">
                        <i data-lucide="eraser" class="w-4 h-4" stroke-width="2"></i>
                    </button>
                    <button class="p-2 rounded-md transition-all duration-200 text-slate-400 hover:bg-slate-800 hover:text-slate-200" title="Measure">
                        <i data-lucide="ruler" class="w-4 h-4" stroke-width="2"></i>
                    </button>
                    <button class="p-2 rounded-md transition-all duration-200 text-slate-400 hover:bg-slate-800 hover:text-slate-200" title="Text">
                        <i data-lucide="type" class="w-4 h-4" stroke-width="2"></i>
                    </button>
                    <button class="p-2 rounded-md transition-all duration-200 text-slate-400 hover:bg-slate-800 hover:text-slate-200" title="Rectangle">
                        <i data-lucide="square" class="w-4 h-4" stroke-width="2"></i>
                    </button>
                    <div class="w-px h-6 bg-slate-700 mx-1"></div>
                    <button class="p-2 text-slate-400 hover:text-white rounded-md hover:bg-slate-800 transition-all text-xs font-medium">Done</button>
                </div>
            </div>

            <!-- --- COLUMN 3: LIST VIEW LEVEL --- -->
            <div class="w-48 bg-slate-950 border border-slate-700 rounded-lg flex flex-col overflow-hidden">
                <div class="h-8 bg-slate-900 border-b border-slate-800 flex items-center justify-center shrink-0">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">List View Level</span>
                </div>
                <div class="flex-1 overflow-y-auto p-2 scrollbar-thin">
                    <div class="space-y-1">
                        <button class="w-full flex items-center justify-between px-3 py-2 rounded-md text-left text-sm font-medium transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                            <span>Roof</span>
                        </button>
                        <button class="w-full flex items-center justify-between px-3 py-2 rounded-md text-left text-sm font-medium transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                            <span>Lv 4</span>
                        </button>
                        <button class="w-full flex items-center justify-between px-3 py-2 rounded-md text-left text-sm font-medium transition-all bg-slate-700 text-white">
                            <span>Lv 3</span>
                            <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                        </button>
                        <button class="w-full flex items-center justify-between px-3 py-2 rounded-md text-left text-sm font-medium transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                            <span>Lv 2</span>
                        </button>
                        <button class="w-full flex items-center justify-between px-3 py-2 rounded-md text-left text-sm font-medium transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                            <span>Lv 1</span>
                        </button>
                        <button class="w-full flex items-center justify-between px-3 py-2 rounded-md text-left text-sm font-medium transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                            <span>Ground</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
