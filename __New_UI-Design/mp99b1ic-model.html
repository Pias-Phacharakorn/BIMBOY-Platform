<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="mp99b1j6-workspace-shell.css">
    <style>
        .viewport-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }
        .control-group {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .side-panel {
            width: 300px;
            background: var(--bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }
        .panel-content {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        .tree-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
            color: var(--fg);
            cursor: pointer;
        }
        .tree-item:hover { color: var(--accent); }
        .tree-item svg { color: var(--muted); }
        
        .mode-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-alt);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
        }
    </style>
</head>

                <!-- Right Side Panel -->
                <aside class="side-panel">

    <script>
        const collapseBtn = document.getElementById('collapseBtn');
        const appContainer = document.querySelector('.app-container');
        
        collapseBtn.addEventListener('click', () => {
            appContainer.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', appContainer.classList.contains('collapsed'));
        });

        // Restore state
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            appContainer.classList.add('collapsed');
        }
    </script>
