            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
        }
        .form-input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            color: var(--fg);
            font-family: var(--font-ui);

        <main class="main-content">
            <header class="header">
                <div style="font-weight: 600; font-size: 15px;">Project Settings</div>
                <button class="btn btn-primary">Save Changes</button>
            </header>

            <div class="workspace-area">
                <div class="settings-grid">
                    <section class="settings-section">
                        <h2 style="font-size: 18px;">General Information</h2>
                        <div class="form-group">
                            <label class="form-label">Project Name</label>
                            <input type="text" class="form-input" value="Hospital Expansion Phase II">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Project Number</label>
                            <input type="text" class="form-input" value="PRJ-2024-001">
                        </div>
                    </section>

                    <section class="settings-section">
                        <h2 style="font-size: 18px;">Members & Permissions</h2>
                        <table class="tech-table">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>admin@learnthatopen.com</td>
                                    <td><span class="status-chip ok">Admin</span></td>
                                    <td>Active</td>
                                    <td style="text-align: right;"><button class="btn btn-ghost">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>engineer@site.com</td>
                                    <td><span class="status-chip">Member</span></td>
                                    <td>Active</td>
                                    <td style="text-align: right;"><button class="btn btn-ghost">Edit</button></td>
                                </tr>
                            </tbody>
                        </table>
                        <button class="btn" style="width: fit-content;">Invite Member</button>
                    </section>

                    <section class="settings-section">
                        <h2 style="font-size: 18px;">Data Connections</h2>
                        <div class="form-group">
                            <label class="form-label">Google Sheets URL (BIM Data)</label>
                            <input type="text" class="form-input" placeholder="https://docs.google.com/spreadsheets/d/...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">CDE Storage (Google Drive)</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" class="form-input" value="Connected: Site_Drives/Project_HXP_II" style="flex: 1;" readonly>
                                <button class="btn">Change</button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script>
        const collapseBtn = document.getElementById('collapseBtn');
        const appContainer = document.querySelector('.app-container');
        
        collapseBtn.addEventListener('click', () => {
            appContainer.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', appContainer.classList.contains('collapsed'));
        });

        // Restore state
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            appContainer.classList.add('collapsed');
        }
    </script>
